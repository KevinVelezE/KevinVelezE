      </g>
      <ellipse rx="61" ry="86" fill="#3156A4" fill-opacity="0.09" stroke="#3156A4" stroke-width="2"/>
      <ellipse cx="-17" cy="-18" rx="18" ry="39" fill="#147D78" fill-opacity="0.18"/>
      <path d="M125-95V95" stroke="#172B4D" stroke-width="3"/>
      <path d="M132-85C140-62 158-56 164-35S174 8 163 33S139 65 132 85" fill="none" stroke="#3156A4" stroke-width="2"/>
    </g>
    <circle r="3" fill="#147D78"/>
  </g>
</svg>
