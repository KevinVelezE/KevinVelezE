<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mathematics, through a computational lens</title>
  <desc id="desc">An editorial composition with parallel projection lines crossing an ellipse and meeting a detector, inspired by tomography.</desc>
  <rect width="1200" height="360" rx="16" fill="#F8FAFC"/>
  <path d="M44 44H1156M44 316H1156M760 44V316" stroke="#DCE4EF"/>
  <text x="48" y="86" fill="#147D78" font-family="sans-serif" font-size="15" letter-spacing="3">ANALYSIS / INVERSE PROBLEMS / COMPUTATION</text>
  <g fill="#172B4D" font-family="Georgia, serif" font-size="57">
    <text x="46" y="169">Mathematics,</text>
    <text x="46" y="237" font-size="47">through a computational lens.</text>
  </g>
  <text x="48" y="291" fill="#3156A4" font-family="sans-serif" font-size="18" letter-spacing="2">KEVIN VÉLEZ ESCARRIA</text>
  <g transform="translate(970 177)">
